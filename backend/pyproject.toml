[project]
name = "storyforge-backend"
version = "0.1.0"
description = "StoryForge - Real-time multimodal storybook generator backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.14",
    "google-adk>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13.0",
    "pydantic-settings>=2.0",
    "reportlab>=4.0",
    "python-dotenv>=1.0",
    "firebase-admin>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
