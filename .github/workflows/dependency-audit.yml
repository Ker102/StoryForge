# Dependency Audit — scan for known vulnerabilities in Python packages
name: Dependency Audit

on:
  push:
    branches: [main]
    paths:
      - "backend/pyproject.toml"
      - "backend/requirements*.txt"
  pull_request:
    branches: [main]
    paths:
      - "backend/pyproject.toml"
      - "backend/requirements*.txt"
  schedule:
    - cron: "0 8 * * 3"  # weekly Wednesday 8 AM UTC

permissions:
  contents: read

jobs:
  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -e .

      - name: Run pip-audit
        run: pip-audit --strict --desc on
